services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: finance-agent-timescaledb
    environment:
      POSTGRES_DB: finance_agent
      POSTGRES_USER: finance_agent
      POSTGRES_PASSWORD: finance_agent
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - finance_agent_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_agent -d finance_agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: finance-agent-redis
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - finance_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  finance_agent_postgres_data:
  finance_agent_redis_data:
