services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: finance-agent-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: finance_agent
      POSTGRES_USER: finance_agent
      POSTGRES_PASSWORD: finance_agent
      TZ: Asia/Shanghai
    command: ["postgres", "-c", "max_connections=300"]
    ports:
      - "5432:5432"
    volumes:
      - finance_agent_postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance_agent -d finance_agent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: finance-agent-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - finance_agent_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  finance-agent-gotdx-gateway:
    container_name: finance-agent-gotdx-gateway
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.gotdx-gateway
    restart: unless-stopped
    environment:
      TDX_GATEWAY_ADDR: ${TDX_GATEWAY_ADDR:-0.0.0.0:8790}
      TDX_TIMEOUT_SECONDS: ${TDX_TIMEOUT_SECONDS:-3}
    expose:
      - "8790"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8790/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  finance-agent-scheduler:
    container_name: finance-agent-scheduler
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scheduler
    restart: unless-stopped
    environment:
      FINANCE_AGENT_DATABASE_URL: ${FINANCE_AGENT_DOCKER_DATABASE_URL:-postgresql+psycopg://finance_agent:finance_agent@postgres:5432/finance_agent}
      FINANCE_AGENT_REDIS_URL: ${FINANCE_AGENT_DOCKER_REDIS_URL:-redis://redis:6379/0}
      FINANCE_AGENT_CACHE_BACKEND: ${FINANCE_AGENT_CACHE_BACKEND:-redis}
      FINANCE_AGENT_DB_POOL_SIZE: ${FINANCE_AGENT_DB_POOL_SIZE:-10}
      FINANCE_AGENT_DB_MAX_OVERFLOW: ${FINANCE_AGENT_DB_MAX_OVERFLOW:-20}
      # 容器内固定使用 Compose 服务名，禁止宿主机 localhost 覆盖请求地址。
      FINANCE_AGENT_GOTDX_GATEWAY_URL: http://finance-agent-gotdx-gateway:8790
      FINANCE_AGENT_GOTDX_URL: http://finance-agent-gotdx-gateway:8790
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      finance-agent-gotdx-gateway:
        condition: service_healthy
    volumes:
      - ./runtime:/app/runtime
    command:
      - python
      - scripts/data/run_base_data_scheduler.py
      - --loop
      - --status-file
      - runtime/base_data_scheduler/status.json
      - --event-log-file
      - runtime/base_data_scheduler/events.jsonl

  finance-agent-mcp:
    container_name: finance-agent-mcp
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.scheduler
    restart: unless-stopped
    environment:
      FINANCE_AGENT_DATABASE_URL: ${FINANCE_AGENT_DOCKER_DATABASE_URL:-postgresql+psycopg://finance_agent:finance_agent@postgres:5432/finance_agent}
      FINANCE_AGENT_REDIS_URL: ${FINANCE_AGENT_DOCKER_REDIS_URL:-redis://redis:6379/0}
      FINANCE_AGENT_CACHE_BACKEND: ${FINANCE_AGENT_CACHE_BACKEND:-redis}
      FINANCE_AGENT_DB_POOL_SIZE: ${FINANCE_AGENT_DB_POOL_SIZE:-10}
      FINANCE_AGENT_DB_MAX_OVERFLOW: ${FINANCE_AGENT_DB_MAX_OVERFLOW:-20}
      FINANCE_AGENT_GOTDX_GATEWAY_URL: http://finance-agent-gotdx-gateway:8790
      FINANCE_AGENT_GOTDX_URL: http://finance-agent-gotdx-gateway:8790
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      finance-agent-gotdx-gateway:
        condition: service_healthy
    ports:
      - "${FINANCE_AGENT_MCP_BIND_HOST:-127.0.0.1}:${FINANCE_AGENT_MCP_PORT:-8765}:8765"
    command:
      - python
      - -m
      - finance_agent.mcp_server
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8765"
      - --streamable-http-path
      - /mcp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8765/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  finance_agent_postgres_data:
  finance_agent_redis_data:
