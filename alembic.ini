[alembic]
script_location = src/finance_agent/storage/migrations
prepend_sys_path = .
timezone = UTC

# FINANCE_AGENT_DATABASE_URL overrides this value.
sqlalchemy.url = postgresql+psycopg://finance_agent:finance_agent@localhost:5432/finance_agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
