[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "0.1.0"
description = "A 股和数字货币 AI 标的推荐系统"
readme = "docs/项目计划.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "akshare>=1.16,<2.0",
  "ccxt>=4.4,<5.0",
  "curl_cffi>=0.7,<1.0",
  "langgraph>=1.2,<2.0",
  "mcp>=1.16,<2.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "requests>=2.32,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "TA-Lib>=0.6.5,<1.0",
]

[project.scripts]
finance-agent = "finance_agent.cli.main:main"
finance-agent-mcp = "finance_agent.mcp_server.server:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
