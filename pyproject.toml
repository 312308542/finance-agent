[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-agent"
version = "0.1.0"
description = "A 股和数字货币 AI 标的推荐系统"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2.0",
  "akshare>=1.16,<2.0",
  "bt>=1.1,<2.0",
  "ccxt>=4.4,<5.0",
  "curl_cffi>=0.7,<1.0",
  "fastapi>=0.115,<1.0",
  "langgraph>=1.2,<2.0",
  "mcp>=1.16,<2.0",
  "neo4j>=5.25,<6.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
  "playwright>=1.49,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "quantstats>=0.0.64,<1.0",
  "redis>=5.2,<6.0",
  "requests>=2.32,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "statsmodels>=0.14.6,<0.15",
  "TA-Lib>=0.6.5,<1.0",
  "uvicorn>=0.32,<1.0",
]

[project.scripts]
finance-agent = "finance_agent.cli.main:main"
finance-agent-mcp = "finance_agent.mcp_server.server:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# 现有 SQL、DTO 与测试断言以 120 字符为主，统一限制并继续拦截真正过长的行。
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# 直接运行时需先注入项目根目录，项目模块导入必须位于路径初始化之后。
"scripts/data/validate_market_regime_gate.py" = ["E402"]
"scripts/storage/smoke_workflow_context_envelope.py" = ["E402"]
# 已发布迁移中的数据库中文注释保持不可变，避免仅为换行改写历史 SQL。
"src/finance_agent/storage/migrations/versions/20260614_0019_create_backtest_tables.py" = ["E501"]
"src/finance_agent/storage/migrations/versions/20260630_0020_create_user_investment_profiles.py" = ["E501"]
